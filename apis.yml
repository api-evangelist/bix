name: Bix
description: 'Bix was an online talent-competition community founded in 2006 by Mike Speiser (co-founder
  of Epinions), where users created and judged web-based contests across karaoke, dance, photography,
  writing, beauty, and comedy. Backed by Trinity Ventures, the roughly 16-person startup grew to over
  one million users within months and was acquired by Yahoo! in November 2006; Yahoo later shut the
  service down. This API Evangelist profile documents Bix as a historical, defunct consumer company
  with no live website, developer platform, or API surface to enrich.'
